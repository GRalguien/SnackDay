<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackDay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff5722; }
        .contenedor {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .producto {
            background: white;
            border-radius: 10px;
            padding: 15px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .precio {
            font-size: 1.2em;
            font-weight: bold;
            color: #2e7d32;
        }
        .boton {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>SnackDay</h1>
    <p>¡Pide tus refrescos y snacks favoritos y te los llevo a la puerta!</p>

    <div class="contenedor">
        <!-- Producto 1 -->
        <div class="producto">
            <h3>Refresco de Cola</h3>
            <p>Lata 33cl bien fría</p>
            <p class="precio">1,00 €</p>
            <a class="boton" href="https://wa.me/34600000000?text=Hola!%20Quiero%20pedir%20un%20Refresco%20de%20Cola">Pedir por WhatsApp</a>
        </div>

        <!-- Producto 2 -->
        <div class="producto">
            <h3>Chocolatina con Leche</h3>
            <p>Tableta clásica</p>
            <p class="precio">1,20 €</p>
            <a class="boton" href="https://wa.me/34600000000?text=Hola!%20Quiero%20pedir%20una%20Chocolatina">Pedir por WhatsApp</a>
        </div>
    </div>

</body>
</html>
