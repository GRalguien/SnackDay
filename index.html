<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackDay | Tu quiosco del barrio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- =========================================================
         BLOQUE 1: ESTILOS VISUALES (colores, tarjetas, cesta y modales)
         ========================================================= -->
    <style>
        :root {
            --color-principal: #ff5722;
            --color-principal-hover: #e64a19;
            --color-fondo: #f8f9fc;
            --color-texto: #2d3436;
            --color-precio: #2e7d32;
            --color-whatsapp: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            padding-bottom: 60px;
        }

        /* Cabecera */
        header {
            background: linear-gradient(135deg, #ff6b35, #ff3d00);
            color: white;
            padding: 45px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 87, 34, 0.25);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.95;
            max-width: 560px;
            margin: 0 auto;
        }

        /* Botón flotante de cesta */
        .cesta-flotante {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            color: var(--color-texto);
            border: none;
            padding: 12px 18px;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            transition: transform 0.2s;
        }

        .cesta-flotante:hover {
            transform: scale(1.06);
        }

        .contador-cesta {
            background: var(--color-principal);
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* Grid de productos */
        .contenedor {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .producto {
            background: white;
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.25s, box-shadow 0.25s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .producto:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
        }

        .emoji-producto {
            font-size: 3.8rem;
            margin-bottom: 10px;
        }

        .producto h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .producto .desc {
            font-size: 0.88rem;
            color: #636e72;
            margin-bottom: 12px;
        }

        .ver-info {
            font-size: 0.78rem;
            color: var(--color-principal);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .precio {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--color-precio);
            margin-bottom: 14px;
        }

        .btn-anadir {
            width: 100%;
            padding: 11px;
            background: var(--color-principal);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-anadir:hover {
            background: var(--color-principal-hover);
        }

        /* Ventana emergente de nutrición */
        .fondo-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .fondo-modal.activo {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            padding: 28px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: aparecer 0.2s ease-out;
        }

        @keyframes aparecer {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .cerrar-modal {
            position: absolute;
            top: 16px;
            right: 18px;
            background: #f1f2f6;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
        }

        .tabla-nutricion {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0 20px;
            font-size: 0.92rem;
        }

        .tabla-nutricion td {
            padding: 9px 10px;
            border-bottom: 1px solid #eee;
        }

        .tabla-nutricion td:last-child {
            text-align: right;
            font-weight: 600;
        }

        /* Panel lateral de la cesta */
        .panel-cesta {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: white;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.18);
            z-index: 300;
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
        }

        .panel-cesta.abierta {
            right: 0;
        }

        .lista-cesta {
            flex: 1;
            overflow-y: auto;
            margin: 20px 0;
        }

        .item-cesta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .controles-cantidad button {
            background: #f1f2f6;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .total-cesta {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .btn-comprar {
            width: 100%;
            padding: 14px;
            background: var(--color-whatsapp);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- =========================================================
         BLOQUE 2: ESTRUCTURA VISIBLE DE LA PÁGINA
         ========================================================= -->
    <button class="cesta-flotante" onclick="abrirCesta()">
        🛒 Cesta <span class="contador-cesta" id="contador">0</span>
    </button>

    <header>
        <h1>🍫🥤 SnackDay</h1>
        <p>¡Pincha en cualquier producto para ver su información nutricional o añádelo directo a tu cesta!</p>
    </header>

    <main class="contenedor" id="catalogo"></main>

    <!-- Modal de información nutricional -->
    <div class="fondo-modal" id="modalProducto" onclick="cerrarModalSiFondo(event)">
        <div class="modal">
            <button class="cerrar-modal" onclick="cerrarModalProducto()">✕</button>
            <div style="text-align:center;">
                <div id="mEmoji" style="font-size:4rem;"></div>
                <h2 id="mNombre" style="margin-top:6px;"></h2>
                <p id="mDesc" style="color:#636e72; font-size:0.9rem; margin-top:4px;"></p>
            </div>
            <table class="tabla-nutricion">
                <tr><td>🔥 Calorías</td><td id="mCalorias"></td></tr>
                <tr><td>🍞 Hidratos de carbono</td><td id="mHidratos"></td></tr>
                <tr><td>🍬 de los cuales azúcares</td><td id="mAzucares"></td></tr>
                <tr><td>💪 Proteínas</td><td id="mProteinas"></td></tr>
                <tr><td>🧈 Grasas</td><td id="mGrasas"></td></tr>
            </table>
            <button class="btn-anadir" id="mBtnAnadir">Añadir a la cesta</button>
        </div>
    </div>

    <!-- Panel lateral de la cesta -->
    <aside class="panel-cesta" id="panelCesta">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>🛒 Tu Cesta</h2>
            <button class="cerrar-modal" style="position:static;" onclick="cerrarCesta()">✕</button>
        </div>
        <div class="lista-cesta" id="listaCesta">
            <p style="color:#888; text-align:center; margin-top:40px;">Tu cesta está vacía</p>
        </div>
        <div>
            <div class="total-cesta">
                <span>Total:</span>
                <span id="totalPrecio">0,00 €</span>
            </div>
            <button class="btn-comprar" onclick="enviarPedidoWhatsApp()">Pedir por WhatsApp 📲</button>
        </div>
    </aside>

    <!-- =========================================================
         BLOQUE 3: CONFIGURACIÓN Y DATOS DE TU TIENDA
         (Aquí es donde sueles editar cosas día a día)
         ========================================================= -->
    <script>
        // 1. Tu teléfono con prefijo de país y sin espacios (ejemplo España: "34612345678")
        const TELEFONO_WHATSAPP = "614437939";

        // 2. Catálogo de productos (cada bloque {...} es una tarjeta)
        const PRODUCTOS = [
            {
                id: 1,
                nombre: "CocaCola",
                emoji: "🥤",
                desc: "Lata 33cl bien fría",
                precio: 1.00,
                calorias: "139 kcal",
                hidratos: "35 g",
                azucares: "35 g",
                proteinas: "0 g",
                grasas: "0 g"
            },
            {
                id: 2,
                nombre: "Chocolatina con Leche",
                emoji: "🍫",
                desc: "Tableta clásica crujiente",
                precio: 1.20,
                calorias: "245 kcal",
                hidratos: "28 g",
                azucares: "24 g",
                proteinas: "3,2 g",
                grasas: "13 g"
            },
            {
                id: 3,
                nombre: "Pringless",
                emoji: "🥔",
                desc: "Bolsa individual al punto de sal",
                precio: 1.10,
                calorias: "215 kcal",
                hidratos: "21 g",
                azucares: "0,3 g",
                proteinas: "2,5 g",
                grasas: "13,5 g"
            },
            {
                id: 4,
                nombre: "Fanta",
                emoji: "🍊",
                desc: "Lata 33cl con gas y burbujas",
                precio: 1.00,
                calorias: "145 kcal",
                hidratos: "36 g",
                azucares: "36 g",
                proteinas: "0 g",
                grasas: "0 g"
            }
        ];

        // Estado actual de la cesta en memoria
        let cesta = [];

        // =========================================================
        // BLOQUE 4: FUNCIONES AUXILIARES (formato y utilidades)
        // =========================================================
        function formatearEuros(valor) {
            return Number(valor || 0).toFixed(2).replace(".", ",") + " €";
        }

        function buscarProductoPorId(id) {
            return PRODUCTOS.find(item => item.id === id);
        }

        // =========================================================
        // BLOQUE 5: RENDERIZADO DEL CATÁLOGO Y MODAL NUTRICIONAL
        // =========================================================
        function renderizarCatalogo() {
            const contenedorCatalogo = document.getElementById("catalogo");
            contenedorCatalogo.innerHTML = "";

            PRODUCTOS.forEach(producto => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "producto";
                tarjeta.onclick = () => abrirModalNutricion(producto.id);

                tarjeta.innerHTML = `
                    <div>
                        <div class="emoji-producto">${producto.emoji || "🍬"}</div>
                        <h3>${producto.nombre || "Producto"}</h3>
                        <p class="desc">${producto.desc || ""}</p>
                        <p class="ver-info">ℹ️ Ver hidratos y calorías</p>
                    </div>
                    <div>
                        <p class="precio">${formatearEuros(producto.precio)}</p>
                        <button class="btn-anadir" onclick="event.stopPropagation(); anadirACesta(${producto.id})">
                            + Añadir a la cesta
                        </button>
                    </div>
                `;

                contenedorCatalogo.appendChild(tarjeta);
            });
        }

        function abrirModalNutricion(id) {
            const producto = buscarProductoPorId(id);
            if (!producto) return;

            document.getElementById("mEmoji").textContent = producto.emoji || "🍬";
            document.getElementById("mNombre").textContent = producto.nombre || "Producto";
            document.getElementById("mDesc").textContent = producto.desc || "";
            document.getElementById("mCalorias").textContent = producto.calorias || "-";
            document.getElementById("mHidratos").textContent = producto.hidratos || "-";
            document.getElementById("mAzucares").textContent = producto.azucares || "-";
            document.getElementById("mProteinas").textContent = producto.proteinas || "-";
            document.getElementById("mGrasas").textContent = producto.grasas || "-";

            document.getElementById("mBtnAnadir").onclick = () => {
                anadirACesta(producto.id);
                cerrarModalProducto();
            };

            document.getElementById("modalProducto").classList.add("activo");
        }

        function cerrarModalProducto() {
            document.getElementById("modalProducto").classList.remove("activo");
        }

        function cerrarModalSiFondo(evento) {
            if (evento.target.id === "modalProducto") {
                cerrarModalProducto();
            }
        }

        // =========================================================
        // BLOQUE 6: GESTIÓN DE LA CESTA Y ENVÍO A WHATSAPP
        // =========================================================
        function anadirACesta(id) {
            const itemExistente = cesta.find(item => item.id === id);
            if (itemExistente) {
                itemExistente.cantidad += 1;
            } else {
                const producto = buscarProductoPorId(id);
                if (!producto) return;
                cesta.push({ ...producto, cantidad: 1 });
            }
            renderizarCesta();
        }

        function cambiarCantidad(id, delta) {
            const item = cesta.find(entry => entry.id === id);
            if (!item) return;

            item.cantidad += delta;
            if (item.cantidad <= 0) {
                cesta = cesta.filter(entry => entry.id !== id);
            }
            renderizarCesta();
        }

        function renderizarCesta() {
            const listaCesta = document.getElementById("listaCesta");
            const contador = document.getElementById("contador");
            const totalPrecio = document.getElementById("totalPrecio");

            const totalUnidades = cesta.reduce((suma, item) => suma + item.cantidad, 0);
            const totalEuros = cesta.reduce((suma, item) => suma + (item.precio * item.cantidad), 0);

            contador.textContent = totalUnidades;
            totalPrecio.textContent = formatearEuros(totalEuros);

            if (cesta.length === 0) {
                listaCesta.innerHTML = '<p style="color:#888; text-align:center; margin-top:40px;">Tu cesta está vacía</p>';
                return;
            }

            listaCesta.innerHTML = cesta.map(item => `
                <div class="item-cesta">
                    <div>
                        <strong>${item.emoji || "🍬"} ${item.nombre}</strong><br>
                        <small>${formatearEuros(item.precio * item.cantidad)}</small>
                    </div>
                    <div class="controles-cantidad">
                        <button onclick="cambiarCantidad(${item.id}, -1)">-</button>
                        <span style="margin:0 8px; font-weight:bold;">${item.cantidad}</span>
                        <button onclick="cambiarCantidad(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join("");
        }

        function abrirCesta() {
            document.getElementById("panelCesta").classList.add("abierta");
        }

        function cerrarCesta() {
            document.getElementById("panelCesta").classList.remove("abierta");
        }

        function enviarPedidoWhatsApp() {
            if (cesta.length === 0) {
                alert("¡Añade algún snack o refresco a tu cesta primero!");
                return;
            }

            let mensaje = "¡Hola! Quiero hacer este pedido en SnackDay:%0A%0A";
            cesta.forEach(item => {
                mensaje += `• ${item.cantidad}x ${item.nombre} (${formatearEuros(item.precio * item.cantidad)})%0A`;
            });

            const total = cesta.reduce((suma, item) => suma + (item.precio * item.cantidad), 0);
            mensaje += `%0A*Total a pagar: ${formatearEuros(total)}*`;

            const urlWhatsApp = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;
            window.open(urlWhatsApp, "_blank");
        }

        // =========================================================
        // BLOQUE 7: ARRANQUE INICIAL DE LA PÁGINA
        // =========================================================
        renderizarCatalogo();
        renderizarCesta();
    </script>
</body>
</html>
